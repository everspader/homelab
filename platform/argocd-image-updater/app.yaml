apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # 1. Helm chart — values from $values (source #2).
    - chart: argocd-image-updater
      repoURL: https://argoproj.github.io/argo-helm
      # 1.x line — Kubebuilder operator driven by `ImageUpdater` CRs (the chart
      # installs the CRD). One CR per tenant in manifests/<tenant>.yaml.
      # 1.4+ is required: earlier CRDs stored defaults that broke setting
      # inheritance.
      targetRevision: 1.5.0
      helm:
        valueFiles:
          - $values/platform/argocd-image-updater/values.yaml
    # 2. This repo as $values for the chart (no manifests applied from here).
    - repoURL: https://github.com/everspader/homelab.git
      targetRevision: HEAD
      ref: values
    # 3. Raw manifests under manifests/ — the GHCR pull SealedSecret, RBAC to
    #    read argocd/github-app-homelab (git push creds), and the ImageUpdater
    #    CRs (namespace `argocd`).
    - repoURL: https://github.com/everspader/homelab.git
      targetRevision: HEAD
      path: platform/argocd-image-updater/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-image-updater
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false  # namespace is owned by platform/namespaces
      # The ImageUpdater CRs ship in the same sync as the chart's CRD.
      - SkipDryRunOnMissingResource=true
