# HMAC secret for the GHCR webhook (key webhook.ghcr-secret). The chart's
# Deployment reads it as GHCR_WEBHOOK_SECRET from this exact Secret name.
# The same value goes into each app repo's GitHub webhook settings.
# Plaintext source: platform/argocd-image-updater/webhook.env (gitignored).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-image-updater-secret
  namespace: argocd-image-updater
spec:
  encryptedData:
    webhook.ghcr-secret: 
  template:
    metadata:
      name: argocd-image-updater-secret
      namespace: argocd-image-updater
