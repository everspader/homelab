# GHCR read credential for the image updater's registry-wide entry in
# values.yaml (config.registries). Copied from rookia/ghcr-pull (same PAT,
# verified to list tags on rookia-api, tally-api, tally-worker, kotin-api).
# 1.x refuses per-image pull secrets from another namespace, so the
# controller needs its own copy. Re-seal from the PAT if it rotates.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-pull
  namespace: argocd-image-updater
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: ghcr-pull
      namespace: argocd-image-updater
    type: kubernetes.io/dockerconfigjson
