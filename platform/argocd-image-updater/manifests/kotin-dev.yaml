# Image updater config for the kotin-dev Application.
#
# The image is built by the Kotin app repo's CI on `api@X.Y.Z` release tags and
# pushed as ghcr.io/everspader/kotin-api:X.Y.Z. A newer strict-semver tag is
# committed into tenants/kotin-dev/manifests/kustomization.yaml's `images:`
# block; ArgoCD rolls it out.
#
# GHCR auth is registry-wide (values.yaml `config.registries`), so no pullSecret.
# Must live in `argocd`: 1.x only selects Applications in the CR's namespace.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: kotin-dev
  namespace: argocd
spec:
  commonUpdateSettings:
    updateStrategy: semver
    allowTags: 'regexp:^\d+\.\d+\.\d+$'
  writeBackConfig:
    # ArgoCD's GitHub App; must be in the CR's namespace. Needs Contents: write.
    method: git:secret:github-app-homelab
    gitConfig:
      branch: main
      writeBackTarget: kustomization
  applicationRefs:
    - namePattern: kotin-dev
      images:
        - alias: kotin
          imageName: ghcr.io/everspader/kotin-api
