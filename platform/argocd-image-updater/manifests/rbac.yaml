# Cross-namespace Secret read for the argocd-image-updater ServiceAccount.
#
# The chart grants the controller its own RBAC: a ClusterRole for Applications
# and ImageUpdater CRs, plus Secret/ConfigMap reads in its own namespace (which
# covers argocd-image-updater/ghcr-pull, the registry-wide GHCR credential).
#
# What's missing is read access to argocd/github-app-homelab, referenced via
# `git:secret:argocd/github-app-homelab` and reused as git-push creds so we
# don't seal a second copy of the GitHub App key. 1.x only accepts a git
# secret in the Application's namespace, which is `argocd`.
#
# resourceNames pins the Role to that single Secret — least-privilege, no
# blanket Secret read on the argocd namespace.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-image-updater-github-app-reader
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["github-app-homelab"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-image-updater-github-app-reader
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-image-updater-github-app-reader
subjects:
  - kind: ServiceAccount
    name: argocd-image-updater
    namespace: argocd-image-updater
