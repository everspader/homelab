# Argo CD Image Updater (1.x) — watches GHCR for new tenant tags, commits the
# bumped tag back to this repo's kustomization.yaml, and lets ArgoCD do the
# rollout.
#
# 1.x is a Kubebuilder operator: it only acts on Applications matched by an
# `ImageUpdater` CR (manifests/<tenant>.yaml). Those CRs live in the
# `argocd` namespace next to the Applications they select.
#
# Auth model:
#   - Registry: one registry-wide GHCR credential (config.registries below),
#     backed by manifests/sealed-ghcr-pull.yaml in this namespace. 1.x rejects
#     per-image pull secrets from a namespace other than the Application's.
#   - Git push: `git:secret:argocd/github-app-homelab` — ArgoCD's GitHub App,
#     same namespace as the Applications. The App needs `Contents: write`.

config:
  # Every key except name/registries/sshConfig lands verbatim in the
  # argocd-image-updater-config ConfigMap, which the Deployment reads as env.

  # CRs and Applications both live in `argocd`; the controller runs in its own
  # namespace and would otherwise watch only that one.
  watch.namespaces: argocd
  argocd.namespace: argocd

  # Default poll is 2m. 5m is plenty for a homelab and keeps GHCR API calls modest.
  interval: 5m

  log.level: info

  # GHCR push webhook: GitHub `package` events (action `published`) POST to
  # https://image-updater.spaderlabs.com/webhook?type=ghcr.io through the shared
  # Cloudflare Tunnel. The controller re-checks the matching CR right away
  # instead of waiting for the next poll; polling stays on as the fallback.
  # HMAC secret: manifests/sealed-webhook-secret.yaml.
  webhook.enable: "true"
  webhook.port: "8082"
  # Cloudflare terminates TLS; cloudflared talks plain HTTP to the Service.
  disable-tls: "true"

  # Commit author baked into every bump commit. Bot identity, no PII.
  git.user: argocd-image-updater
  git.email: argocd-image-updater@spaderlabs.com
  git.commit-message-template: |
    chore({{ .AppName }}): bump image tag

    {{ range .AppChanges -}}
    - {{ .Image }}:{{ .OldTag }} -> {{ .NewTag }}
    {{ end }}

  registries:
    - name: GitHub Container Registry
      api_url: https://ghcr.io
      prefix: ghcr.io
      ping: yes
      credentials: pullsecret:argocd-image-updater/ghcr-pull
      # Re-read the secret hourly so a rotated PAT is picked up without a restart.
      credsexpire: 1h

# Conservative — single-replica controller, minimal footprint. Bump if it
# starts watching many Applications.
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

metrics:
  enabled: false   # flip on once observability stack is wired to scrape

# ClusterIP Service for the webhook (port 8080 -> container port 8082). The
# tunnel's public hostname points at
# http://argocd-image-updater.argocd-image-updater.svc.cluster.local:8080
service:
  enabled: true
