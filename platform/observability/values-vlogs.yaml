# victoria-logs-single values — log database for the homelab.
# Vector (manifests/vector.yaml) ships pod logs into the JSON-line ingest
# endpoint at http://observability-victoria-logs-single-server:9428/insert/jsonline.

server:
  retentionPeriod: 14d   # match VMSingle's 15d-ish window
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  persistentVolume:
    enabled: true
    size: 5Gi
  service:
    type: ClusterIP
