# GENERATED — see scratchpad/gen-dashboards.ts. Tally tenant dashboards.
# Log panels derive from the API's structured JSON logs (packages/api/src/
# middleware/request-log.ts + core logEvent). Queries filter namespace="tally"
# EXACTLY, so the dev API (namespace=tally-dev) never pollutes these metrics.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-tally-api
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  tally-api.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "tags": [
        "tenant",
        "tally"
      ],
      "title": "Tally / API",
      "uid": "tenant-tally-api",
      "version": 3,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Metrics",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "VictoriaMetrics",
              "value": "VictoriaMetrics"
            }
          },
          {
            "name": "logs_datasource",
            "label": "Logs",
            "type": "datasource",
            "query": "victoriametrics-logs-datasource",
            "current": {
              "text": "VictoriaLogs",
              "value": "VictoriaLogs"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 101,
          "type": "stat",
          "title": "Requests (range)",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${logs_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "stats",
              "expr": "{namespace=\"tally\"} | unpack_json | filter msg:=\"req\" | stats count() reqs"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "id": 102,
          "type": "stat",
          "title": "p95 latency (ms)",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${logs_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "stats",
              "expr": "{namespace=\"tally\"} | unpack_json | filter msg:=\"req\" | stats quantile(0.95, dur_ms) p95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            }
          }
        },
        {
          "id": 103,
          "type": "stat",
          "title": "5xx (range)",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${logs_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "stats",
              "expr": "{namespace=\"tally\"} | unpack_json | filter msg:=\"req\" class:=\"5xx\" | stats count() errors"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              }
            }
          }
        },
        {
          "id": 104,
          "type": "stat",
          "title": "4xx (range)",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${logs_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "stats",
              "expr": "{namespace=\"tally\"} | unpack_json | filter msg:=\"req\" class:=\"4xx\" | stats count() c"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            }
          }
        },
        {
          "id": 105,
          "type": "timeseries",
          "title": "Requests by status class",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${logs_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "statsRange",
              "expr": "{namespace=\"tally\"} | unpack_json | filter msg:=\"req\" | stats by (class) count() reqs",
              "legendFormat": "{{class}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "stacking": {
                  "mode": "normal"
                },
                "fillOpacity": 60,
                "lineWidth": 0
              }
            }
          }
        },
        {
          "id": 106,
          "type": "timeseries",
          "title": "Request latency (ms) — p50 / p95 / p99",
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${logs_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "statsRange",
              "expr": "{namespace=\"tally\"} | unpack_json | filter msg:=\"req\" | stats quantile(0.5, dur_ms) p50, quantile(0.95, dur_ms) p95, quantile(0.99, dur_ms) p99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10
              }
            }
          }
        },
        {
          "id": 107,
          "type": "timeseries",
          "title": "Requests by method",
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 8,
            "h": 7
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${logs_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "statsRange",
              "expr": "{namespace=\"tally\"} | unpack_json | filter msg:=\"req\" | stats by (method) count() reqs",
              "legendFormat": "{{method}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10
              }
            }
          }
        },
        {
          "id": 108,
          "type": "timeseries",
          "title": "Traffic per pod",
          "gridPos": {
            "x": 8,
            "y": 12,
            "w": 8,
            "h": 7
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${logs_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "statsRange",
              "expr": "{namespace=\"tally\"} | unpack_json | filter msg:=\"req\" | stats by (pod) count() reqs",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10
              }
            }
          }
        },
        {
          "id": 109,
          "type": "table",
          "title": "Slowest routes (max ms)",
          "gridPos": {
            "x": 16,
            "y": 12,
            "w": 8,
            "h": 7
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${logs_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "stats",
              "expr": "{namespace=\"tally\"} | unpack_json | filter msg:=\"req\" | stats by (method, route) max(dur_ms) max_ms, quantile(0.95, dur_ms) p95, count() reqs | sort by (max_ms desc) | limit 25"
            }
          ],
          "options": {
            "showHeader": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        }
      ]
    }
