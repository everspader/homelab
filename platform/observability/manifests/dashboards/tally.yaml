# GENERATED — see scratchpad/gen-dashboards.ts. Tally tenant dashboards.
# Log panels derive from the API's structured JSON logs (packages/api/src/
# middleware/request-log.ts + core logEvent). Queries filter namespace="tally"
# EXACTLY, so the dev API (namespace=tally-dev) never pollutes these metrics.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-tally
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  tally.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "tags": [
        "tenant",
        "tally"
      ],
      "title": "Tally / Overview",
      "uid": "tenant-tally",
      "version": 3,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Metrics",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "VictoriaMetrics",
              "value": "VictoriaMetrics"
            }
          },
          {
            "name": "logs_datasource",
            "label": "Logs",
            "type": "datasource",
            "query": "victoriametrics-logs-datasource",
            "current": {
              "text": "VictoriaLogs",
              "value": "VictoriaLogs"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "API replicas (ready / desired)",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "ready",
              "expr": "kube_deployment_status_replicas_ready{namespace=\"tally\",deployment=\"api\"}"
            },
            {
              "refId": "B",
              "legendFormat": "desired",
              "expr": "kube_deployment_spec_replicas{namespace=\"tally\",deployment=\"api\"}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Restarts last 24h",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"tally\"}[24h]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "5xx (range)",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${logs_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "stats",
              "expr": "{namespace=\"tally\"} | unpack_json | filter msg:=\"req\" class:=\"5xx\" | stats count() errors"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              }
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Sweeps (last 2h)",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${logs_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "stats",
              "expr": "{namespace=\"tally\"} | unpack_json | filter msg:=\"event\" event:=\"sweep\" | stats count() sweeps"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "timeFrom": "2h"
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Requests by status class",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${logs_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "statsRange",
              "expr": "{namespace=\"tally\"} | unpack_json | filter msg:=\"req\" | stats by (class) count() reqs",
              "legendFormat": "{{class}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "stacking": {
                  "mode": "normal"
                },
                "fillOpacity": 60,
                "lineWidth": 0
              }
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Request latency (ms) — p50 / p95 / p99",
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${logs_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "statsRange",
              "expr": "{namespace=\"tally\"} | unpack_json | filter msg:=\"req\" | stats quantile(0.5, dur_ms) p50, quantile(0.95, dur_ms) p95, quantile(0.99, dur_ms) p99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10
              }
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Sweep throughput (rules / txns / cc-payments)",
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${logs_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "statsRange",
              "expr": "{namespace=\"tally\"} | unpack_json | filter msg:=\"event\" event:=\"sweep\" | stats sum(due_rules) due_rules, sum(tx_created) tx_created, sum(cc_payments) cc_payments"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10
              }
            }
          }
        },
        {
          "id": 8,
          "type": "logs",
          "title": "Server errors — stderr (5xx + stack traces)",
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${logs_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"tally\", stream=\"stderr\"}"
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "showLabels": false,
            "showCommonLabels": false
          }
        }
      ]
    }
