# Homelab Overview — single-pane view of the G11 host + the k3s cluster.
# Pin as your home dashboard (User → Profile → Default Home Dashboard).
#
# Chart-bundled dashboards already cover most of these signals individually
# (Node Exporter Full, Kubernetes Views / Global, etc.). This one stitches
# the headline numbers from each into one screen so you can answer
# "is anything on fire?" in 5 seconds.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-homelab-overview
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  homelab-overview.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "tags": ["homelab"],
      "title": "Homelab Overview",
      "uid": "homelab-overview",
      "version": 1,
      "time": {"from": "now-6h", "to": "now"},
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {"text": "VictoriaMetrics", "value": "VictoriaMetrics"},
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Host uptime",
          "gridPos": {"h": 4, "w": 4, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [{"refId": "A", "expr": "time() - node_boot_time_seconds"}],
          "fieldConfig": {"defaults": {"unit": "s", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 300}]}}}
        },
        {
          "id": 2, "type": "stat", "title": "Nodes ready",
          "gridPos": {"h": 4, "w": 4, "x": 4, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [{"refId": "A", "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})"}],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}}
        },
        {
          "id": 3, "type": "stat", "title": "Pods running",
          "gridPos": {"h": 4, "w": 4, "x": 8, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [{"refId": "A", "expr": "sum(kube_pod_status_phase{phase=\"Running\"})"}],
          "fieldConfig": {"defaults": {"unit": "short"}}
        },
        {
          "id": 4, "type": "stat", "title": "Pods not running",
          "gridPos": {"h": 4, "w": 4, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [{"refId": "A", "expr": "sum(kube_pod_status_phase{phase=~\"Failed|Pending|Unknown\"})"}],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}}
        },
        {
          "id": 5, "type": "stat", "title": "Restarts last 1h",
          "gridPos": {"h": 4, "w": 4, "x": 16, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [{"refId": "A", "expr": "sum(increase(kube_pod_container_status_restarts_total[1h]))"}],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 10}]}}}
        },
        {
          "id": 6, "type": "stat", "title": "OOMKills last 24h",
          "gridPos": {"h": 4, "w": 4, "x": 20, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [{"refId": "A", "expr": "sum(increase(container_oom_events_total[24h]))"}],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}}
        },
        {
          "id": 10, "type": "timeseries", "title": "Host CPU %",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [{"refId": "A", "legendFormat": "{{cpu}}", "expr": "100 - (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]) * 100)"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}}
        },
        {
          "id": 11, "type": "timeseries", "title": "Host memory %",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [{"refId": "A", "legendFormat": "used", "expr": "(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}}
        },
        {
          "id": 12, "type": "timeseries", "title": "Host disk used %",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [{"refId": "A", "legendFormat": "{{mountpoint}}", "expr": "100 * (1 - node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay|devtmpfs|squashfs|fuse.*\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay|devtmpfs|squashfs|fuse.*\"})"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}}
        },
        {
          "id": 13, "type": "timeseries", "title": "Host network throughput",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {"refId": "A", "legendFormat": "rx {{device}}", "expr": "rate(node_network_receive_bytes_total{device!~\"lo|veth.*|docker.*|cni.*|flannel.*\"}[5m])"},
            {"refId": "B", "legendFormat": "tx {{device}}", "expr": "-rate(node_network_transmit_bytes_total{device!~\"lo|veth.*|docker.*|cni.*|flannel.*\"}[5m])"}
          ],
          "fieldConfig": {"defaults": {"unit": "Bps"}}
        },
        {
          "id": 20, "type": "timeseries", "title": "CPU by namespace",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [{"refId": "A", "legendFormat": "{{namespace}}", "expr": "sum(rate(container_cpu_usage_seconds_total{namespace!=\"\",container!=\"\"}[5m])) by (namespace)"}],
          "fieldConfig": {"defaults": {"unit": "short"}}
        },
        {
          "id": 21, "type": "timeseries", "title": "Memory by namespace",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [{"refId": "A", "legendFormat": "{{namespace}}", "expr": "sum(container_memory_working_set_bytes{namespace!=\"\",container!=\"\"}) by (namespace)"}],
          "fieldConfig": {"defaults": {"unit": "bytes"}}
        },
        {
          "id": 30, "type": "table", "title": "Top 10 pods by CPU",
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 28},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [{"refId": "A", "instant": true, "format": "table", "expr": "topk(10, sum(rate(container_cpu_usage_seconds_total{container!=\"\",namespace!=\"\"}[5m])) by (namespace, pod))"}],
          "fieldConfig": {"defaults": {"unit": "short"}}
        },
        {
          "id": 31, "type": "table", "title": "Top 10 pods by memory",
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 28},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [{"refId": "A", "instant": true, "format": "table", "expr": "topk(10, sum(container_memory_working_set_bytes{container!=\"\",namespace!=\"\"}) by (namespace, pod))"}],
          "fieldConfig": {"defaults": {"unit": "bytes"}}
        }
      ]
    }
