# GENERATED — see scratchpad/gen-dashboards.ts. Tally tenant dashboards.
# Log panels derive from the API's structured JSON logs (packages/api/src/
# middleware/request-log.ts + core logEvent). Queries filter namespace="tally"
# EXACTLY, so the dev API (namespace=tally-dev) never pollutes these metrics.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-tally-infra
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  tally-infra.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "tags": [
        "tenant",
        "tally"
      ],
      "title": "Tally / Infra",
      "uid": "tenant-tally-infra",
      "version": 3,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Metrics",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "VictoriaMetrics",
              "value": "VictoriaMetrics"
            }
          },
          {
            "name": "logs_datasource",
            "label": "Logs",
            "type": "datasource",
            "query": "victoriametrics-logs-datasource",
            "current": {
              "text": "VictoriaLogs",
              "value": "VictoriaLogs"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 301,
          "type": "stat",
          "title": "API replicas (ready / desired)",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "ready",
              "expr": "kube_deployment_status_replicas_ready{namespace=\"tally\",deployment=\"api\"}"
            },
            {
              "refId": "B",
              "legendFormat": "desired",
              "expr": "kube_deployment_spec_replicas{namespace=\"tally\",deployment=\"api\"}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "id": 302,
          "type": "stat",
          "title": "Restarts last 24h",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"tally\"}[24h]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            }
          }
        },
        {
          "id": 303,
          "type": "timeseries",
          "title": "CPU per pod",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{pod}}",
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"tally\",container!=\"\"}[5m])) by (pod)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "id": 304,
          "type": "timeseries",
          "title": "Memory per pod",
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{pod}}",
              "expr": "sum(container_memory_working_set_bytes{namespace=\"tally\",container!=\"\"}) by (pod)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "decbytes"
            }
          }
        },
        {
          "id": 305,
          "type": "timeseries",
          "title": "Network per pod",
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 24,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "rx {{pod}}",
              "expr": "sum(rate(container_network_receive_bytes_total{namespace=\"tally\"}[5m])) by (pod)"
            },
            {
              "refId": "B",
              "legendFormat": "tx {{pod}}",
              "expr": "-sum(rate(container_network_transmit_bytes_total{namespace=\"tally\"}[5m])) by (pod)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            }
          }
        }
      ]
    }
