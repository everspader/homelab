# GENERATED — see scratchpad/gen-dashboards.ts. Tally tenant dashboards.
# Log panels derive from the API's structured JSON logs (packages/api/src/
# middleware/request-log.ts + core logEvent). Queries filter namespace="tally"
# EXACTLY, so the dev API (namespace=tally-dev) never pollutes these metrics.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-tally-errors
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  tally-errors.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "tags": [
        "tenant",
        "tally"
      ],
      "title": "Tally / Errors",
      "uid": "tenant-tally-errors",
      "version": 3,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Metrics",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "VictoriaMetrics",
              "value": "VictoriaMetrics"
            }
          },
          {
            "name": "logs_datasource",
            "label": "Logs",
            "type": "datasource",
            "query": "victoriametrics-logs-datasource",
            "current": {
              "text": "VictoriaLogs",
              "value": "VictoriaLogs"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 201,
          "type": "stat",
          "title": "5xx (range)",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${logs_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "stats",
              "expr": "{namespace=\"tally\"} | unpack_json | filter msg:=\"req\" class:=\"5xx\" | stats count() errors"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              }
            }
          }
        },
        {
          "id": 202,
          "type": "stat",
          "title": "4xx (range)",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${logs_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "stats",
              "expr": "{namespace=\"tally\"} | unpack_json | filter msg:=\"req\" class:=\"4xx\" | stats count() c"
