          "id": 210,
          "type": "logs",
          "title": "Logs — namespace=tally",
          "gridPos": {
            "x": 0,
            "y": 30,
            "w": 24,
            "h": 12
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${logs_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"tally\"}"
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
