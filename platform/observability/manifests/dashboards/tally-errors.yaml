                  {
                    "color": "yellow",
                    "value": 1
                  }
                ]
              }
            }
          }
        },
        {
          "id": 204,
          "type": "stat",
          "title": "404 not found (range)",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${logs_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "stats",
              "expr": "{namespace=\"tally\"} | unpack_json | filter msg:=\"req\" status:=404 | stats count() c"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "id": 205,
          "type": "timeseries",
          "title": "4xx / 5xx over time",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
