          "type": "stat",
          "title": "401 unauthorized (range)",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${logs_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "stats",
              "expr": "{namespace=\"tally\"} | unpack_json | filter msg:=\"req\" status:=401 | stats count() c"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
