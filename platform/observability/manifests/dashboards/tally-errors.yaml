          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${logs_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "stats",
              "expr": "{namespace=\"tally\"} | unpack_json | filter msg:=\"req\" class:~\"[45]xx\" | stats by (method, route, status, err_code) count() hits | sort by (hits desc) | limit 25"
            }
          ],
          "options": {
            "showHeader": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "id": 208,
          "type": "timeseries",
          "title": "401 by route",
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${logs_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "statsRange",
              "expr": "{namespace=\"tally\"} | unpack_json | filter msg:=\"req\" status:=401 | stats by (route) count() c",
              "legendFormat": "{{route}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10
              }
            }
          }
        },
        {
          "id": 209,
          "type": "logs",
          "title": "Server errors — stderr (5xx + stack traces)",
          "gridPos": {
            "x": 0,
