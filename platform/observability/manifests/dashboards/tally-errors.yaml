          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${logs_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "statsRange",
              "expr": "{namespace=\"tally\"} | unpack_json | filter msg:=\"req\" class:~\"[45]xx\" | stats by (class) count() reqs",
              "legendFormat": "{{class}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "stacking": {
                  "mode": "normal"
                },
                "fillOpacity": 60,
                "lineWidth": 0
              }
            }
          }
        },
        {
          "id": 206,
          "type": "table",
          "title": "Error codes breakdown",
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${logs_datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "stats",
              "expr": "{namespace=\"tally\"} | unpack_json | filter msg:=\"req\" err_code:* | stats by (err_code, status) count() hits | sort by (hits desc) | limit 25"
