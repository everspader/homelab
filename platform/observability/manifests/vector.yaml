# Vector DaemonSet — tails every pod's stdout/stderr on the node and ships
# them to VictoriaLogs via its JSON-line ingest endpoint. Tiny footprint
# (~30–50Mi RAM per node). One pod per node; on this single-node cluster
# that's a single pod.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: observability
data:
  vector.yaml: |
    data_dir: /vector-data-dir

    api:
      enabled: false

    sources:
      k8s_logs:
        type: kubernetes_logs
        # Don't tail Vector's own logs — avoids feedback loops.
        extra_label_selector: "app.kubernetes.io/name!=vector"

    transforms:
      # Reshape to the structure VictoriaLogs expects: a top-level "_msg"
      # for the log line, "_time" for timestamp, and stream fields used
      # for indexing.
      vlogs_format:
        type: remap
        inputs: [k8s_logs]
        source: |
          ._msg = del(.message)
          ._time = del(.timestamp)
          .stream = del(.stream)
          .namespace = .kubernetes.pod_namespace
          .pod = .kubernetes.pod_name
          .container = .kubernetes.container_name
          .node = .kubernetes.pod_node_name

    sinks:
      vlogs:
        type: http
        inputs: [vlogs_format]
        uri: http://victoria-logs-single-server.observability.svc.cluster.local:9428/insert/jsonline?_msg_field=_msg&_time_field=_time&_stream_fields=stream,namespace,pod,container
        encoding:
          codec: json
        framing:
          method: newline_delimited
        compression: gzip
        request:
          headers:
            Content-Type: application/stream+json
        healthcheck:
          enabled: true
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: observability
  labels:
    app.kubernetes.io/name: vector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector
    spec:
      serviceAccountName: vector
      # Tolerate any taints so we capture logs from system nodes too
      # (irrelevant on single-node, future-proof for multi-node).
      tolerations:
        - operator: Exists
      containers:
        - name: vector
          image: timberio/vector:0.55.0-distroless-libc
          args: [--config-dir, /etc/vector/]
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: VECTOR_SELF_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VECTOR_SELF_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: api
              containerPort: 8686
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/vector/
              readOnly: true
            - name: data
              mountPath: /vector-data-dir
            - name: var-log
              mountPath: /var/log/
              readOnly: true
            - name: var-lib
              mountPath: /var/lib/
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: vector-config
        - name: data
          emptyDir: {}
        - name: var-log
          hostPath:
            path: /var/log/
        - name: var-lib
          hostPath:
            path: /var/lib/
