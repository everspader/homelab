# victoria-metrics-k8s-stack values for the homelab.
# Goal: lightweight metrics + Grafana on a single-node k3s. Logs come from
# the separate victoria-logs-single Helm release (see values-vlogs.yaml)
# and are shipped by the Vector DaemonSet in manifests/vector.yaml.

# ─── Cluster-wide DNS suffix ────────────────────────────────────────────────
# Override the chart's default `cluster.local.` (with trailing dot — the
# canonical absolute-FQDN form) to plain `cluster.local`. The trailing dot
# is valid DNS but Grafana 13's URL parser rejects URLs of the form
# `http://host.svc.cluster.local.:8428` silently — no log line, no error,
# the entire datasource provisioning file gets dropped. K3s uses
# cluster.local without the dot, so this matches reality and unbreaks
# Grafana datasource provisioning at the same time.
global:
  cluster:
    dnsDomain: cluster.local

# ─── VictoriaMetrics Operator ────────────────────────────────────────────────
victoria-metrics-operator:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  operator:
    # Don't watch prometheus-operator CRDs (PodMonitor / ServiceMonitor /
    # PrometheusRule / Probe). We don't have prometheus-operator installed,
    # so the converter's informer cache hangs forever and the operator
    # crashloops with: "failed to wait for podmonitor caches to sync".
    # Use VM-native CRDs (VMServiceScrape, VMPodScrape, VMRule) instead.
    disable_prometheus_converter: true

# ─── VMSingle (single-node TSDB; switch to VMCluster only on multi-node) ─────
vmsingle:
  enabled: true
  spec:
    retentionPeriod: "15d"
    storage:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# ─── VMAgent (scrapes ServiceMonitors / VMServiceScrapes, ships to VMSingle) ─
vmagent:
  enabled: true
  spec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ─── Disabled to keep the stack minimal; add back when alerting is needed ────
vmalert:
  enabled: false
alertmanager:
  enabled: false

# ─── Default datasources override ────────────────────────────────────────────
# The chart's stock defaultDatasources.victoriametrics.datasources renders
# TWO entries: a prometheus-typed one and a "(DS)" one using the native
# `victoriametrics-metrics-datasource` Grafana plugin. We don't install that
# plugin (only the logs one), and Grafana 13 silently skips an entire
# provisioning file if any entry references an unknown plugin type — so
# both datasources end up unprovisioned, with no log line to indicate why.
# Keep only the prometheus-typed one; VictoriaMetrics speaks PromQL natively
# so every chart dashboard works through it.
defaultDatasources:
  victoriametrics:
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        access: proxy
        isDefault: true

# ─── k3s-specific overrides ──────────────────────────────────────────────────
# k3s bundles control-plane components (controller-manager, scheduler, etcd)
# into a single binary, so they're not addressable as separate Services.
# Leaving these enabled triggers two failures:
#   (a) Service names exceed the 63-char DNS label limit
#       ("observability-victoria-metrics-k8s-stack-kube-controller-manager")
#   (b) Even if names fit, the scrapers find no endpoints.
# kubeApiServer and kubelet still work — k3s exposes those normally.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false

# ─── kube-state-metrics ──────────────────────────────────────────────────────
kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ─── node-exporter (DaemonSet — one per node; single node here) ──────────────
prometheus-node-exporter:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# ─── Grafana ─────────────────────────────────────────────────────────────────
# Exposed via the shared Cloudflare Tunnel: in the CF dashboard, add a public
# hostname grafana.spaderlabs.com → http://observability-grafana.observability.svc.cluster.local:80.
# Admin password: chart auto-generates one. Retrieve with:
#   kubectl -n observability get secret observability-grafana \
#     -o jsonpath='{.data.admin-password}' | base64 -d
# To switch to a SealedSecret-managed admin password later, set
# `admin.existingSecret` and seal the secret into manifests/.
grafana:
  enabled: true
  defaultDashboardsTimezone: browser
  # Tell Grafana its public URL so login redirects, cookies, and CSRF
  # checks work behind the Cloudflare Tunnel. Without these, the page
  # may load but logins / API calls fail in confusing ways.
  "grafana.ini":
    server:
      domain: grafana.spaderlabs.com
      root_url: "https://%(domain)s/"
  service:
    type: ClusterIP
  # Recreate (not RollingUpdate) — local-path-provisioner is RWO, so a
  # rolling update would deadlock on the PVC AND double the memory budget
  # while old + new pods coexist. Recreate accepts ~30s of Grafana downtime
  # in exchange for a clean, predictable rollout.
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    size: 1Gi
  # Grafana baseline is ~150–250Mi; plugin install at boot (the VL datasource
  # below) briefly spikes higher, so the limit is set at 512Mi. OOMs at 256Mi.
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 250m
      memory: 512Mi
  # Disabled — modern k8s sets volume ownership via the pod's fsGroup (472,
  # the Grafana chart's default). The init-chown-data container is redundant
  # and was failing with chown exit code 1 on the local-path PVC. With
  # fsGroup, the kubelet handles ownership at mount time.
  initChownData:
    enabled: false
  sidecar:
    dashboards:
      enabled: true
    # Sidecar must be enabled — k8s-stack is 100% sidecar-driven for
    # datasources. Disabling it stops the chart from rendering the
    # VictoriaMetrics datasource ConfigMap entirely (gated by the
    # `or (and grafana.enabled sidecar.datasources.enabled) forceDeployDatasource`
    # check in templates/grafana/datasource.yaml). additionalDataSources
    # also doesn't help — it's shadowed by the sidecar's emptyDir mount.
    # Provision extra datasources as labeled ConfigMaps in manifests/.
    datasources:
      enabled: true
      # Run the first sync as an initContainer so files exist BEFORE Grafana
      # starts. Without this, the sidecar runs in parallel with Grafana, the
      # sidecar wins the race only after Grafana's provisioning module has
      # already completed on an empty directory, and the only re-trigger
      # mechanism (the reload API) returns 401 because of the password
      # mismatch from our earlier `grafana-cli reset-admin-password`. Net
      # effect: zero datasources provisioned despite valid files on disk.
      initDatasources: true
      # Suppress the (always-401) reload API call. New ConfigMaps after
      # startup require a manual `kubectl rollout restart` to pick up.
      # Acceptable trade-off — datasource changes are rare.
      skipReload: true
    resources:
      requests:
        cpu: 25m
        memory: 48Mi
      limits:
        cpu: 100m
        memory: 128Mi
  # VictoriaLogs Grafana plugin (slug confirmed against grafana.com plugin API).
  plugins:
    - victoriametrics-logs-datasource
  # No additionalDataSources here — see comment on sidecar.datasources above.
  # VictoriaMetrics is auto-wired by the chart. VictoriaLogs is provisioned
  # via manifests/grafana-ds-vlogs.yaml (labeled ConfigMap picked up by the
  # sidecar at the same path as the chart's auto-generated one).
