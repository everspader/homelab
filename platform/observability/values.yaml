# victoria-metrics-k8s-stack values for the homelab.
# Goal: lightweight metrics + Grafana on a single-node k3s. Logs come from
# the separate victoria-logs-single Helm release (see values-vlogs.yaml)
# and are shipped by the Vector DaemonSet in manifests/vector.yaml.

# ─── Cluster-wide DNS suffix ────────────────────────────────────────────────
# Override the chart's default `cluster.local.` (with trailing dot — the
# canonical absolute-FQDN form) to plain `cluster.local`. The trailing dot
# is valid DNS but Grafana 13's URL parser rejects URLs of the form
# `http://host.svc.cluster.local.:8428` silently — no log line, no error,
# the entire datasource provisioning file gets dropped. K3s uses
# cluster.local without the dot, so this matches reality and unbreaks
# Grafana datasource provisioning at the same time.
global:
  cluster:
    dnsDomain: cluster.local

# ─── VictoriaMetrics Operator ────────────────────────────────────────────────
# Note on revisionHistoryLimit:
# Each redeploy leaves a dead ReplicaSet behind (default keeps 10).
# Where the subchart exposes the field directly we cap it at 3 (Grafana,
# kube-state-metrics, node-exporter below). VM operator + VL chart
# don't expose it; tolerable since they redeploy rarely.
victoria-metrics-operator:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  operator:
    # Don't watch prometheus-operator CRDs (PodMonitor / ServiceMonitor /
    # PrometheusRule / Probe). We don't have prometheus-operator installed,
    # so the converter's informer cache hangs forever and the operator
    # crashloops with: "failed to wait for podmonitor caches to sync".
    # Use VM-native CRDs (VMServiceScrape, VMPodScrape, VMRule) instead.
    disable_prometheus_converter: true

# ─── VMSingle (single-node TSDB; switch to VMCluster only on multi-node) ─────
vmsingle:
  enabled: true
  spec:
    retentionPeriod: "15d"
    storage:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# ─── VMAgent (scrapes ServiceMonitors / VMServiceScrapes, ships to VMSingle) ─
vmagent:
  enabled: true
  spec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ─── Disabled to keep the stack minimal; add back when alerting is needed ────
vmalert:
  enabled: false
alertmanager:
  enabled: false

# ─── k3s-specific overrides ──────────────────────────────────────────────────
# k3s bundles control-plane components (controller-manager, scheduler, etcd)
# into a single binary, so they're not addressable as separate Services.
# Leaving these enabled triggers two failures:
#   (a) Service names exceed the 63-char DNS label limit
#       ("observability-victoria-metrics-k8s-stack-kube-controller-manager")
#   (b) Even if names fit, the scrapers find no endpoints.
# kubeApiServer and kubelet still work — k3s exposes those normally.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false

# ─── kube-state-metrics ──────────────────────────────────────────────────────
kube-state-metrics:
  enabled: true
  revisionHistoryLimit: 3
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ─── node-exporter (DaemonSet — one per node; single node here) ──────────────
prometheus-node-exporter:
  enabled: true
  revisionHistoryLimit: 3
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# ─── Grafana ─────────────────────────────────────────────────────────────────
# Exposed via the shared Cloudflare Tunnel: in the CF dashboard, add a public
# hostname grafana.spaderlabs.com → http://observability-grafana.observability.svc.cluster.local:80.
# Admin password: chart auto-generates one. Retrieve with:
#   kubectl -n observability get secret observability-grafana \
#     -o jsonpath='{.data.admin-password}' | base64 -d
# To switch to a SealedSecret-managed admin password later, set
# `admin.existingSecret` and seal the secret into manifests/.
grafana:
  enabled: true
  revisionHistoryLimit: 3
  defaultDashboardsTimezone: browser
  # Tell Grafana its public URL so login redirects, cookies, and CSRF
  # checks work behind the Cloudflare Tunnel. Without these, the page
  # may load but logins / API calls fail in confusing ways.
  "grafana.ini":
    server:
      domain: grafana.spaderlabs.com
      root_url: "https://%(domain)s/"
    # ─── GitHub OAuth ──────────────────────────────────────────────────
    # Client ID + Secret come from envFromSecret below (sealed in
    # manifests/grafana-github-oauth.sealedsecret.yaml). Restrict login
    # to a single GitHub user — anyone else who happens to find the URL
    # gets denied at OAuth time, no Grafana account is created.
    "auth.github":
      enabled: true
      allow_sign_up: true
      auto_login: false
      scopes: "user:email,read:org"
      auth_url: https://github.com/login/oauth/authorize
      token_url: https://github.com/login/oauth/access_token
      api_url: https://api.github.com/user
      # JMESPath role map evaluated against the GitHub `/user` response:
      #   - login == 'everspader'         → GrafanaAdmin (full admin)
      #   - login in viewers list         → Viewer (read-only dashboards)
      #   - anything else                 → 'None' → access denied
      #
      # Add friends by appending their GitHub login to the array, e.g.:
      #   contains(['alice','bob','charlie'], login)
      # No GitHub org needed — this is per-username allowlisting.
      role_attribute_path: >-
        login=='everspader' && 'GrafanaAdmin' ||
        (contains([], login) && 'Viewer' || 'None')
      role_attribute_strict: true
    # Basic auth disabled — login is GitHub-only. The admin user still
    # exists in the DB as a record, but the password form is gone and the
    # /api/admin/* endpoints reject basic-auth attempts. Re-enable
    # temporarily by flipping this to true if GitHub OAuth ever breaks.
    "auth.basic":
      enabled: false
    # Disable login form entirely (defense in depth — no obvious target
    # for password brute-force / scanners).
    "auth":
      disable_login_form: true
    "auth.anonymous":
      enabled: false
  # Multiple secrets injected as env. envFromSecret (singular, legacy) takes
  # one; envFromSecrets (plural) takes a list, so we add the Neon password
  # secret alongside the GitHub OAuth one.
  # - grafana-github-oauth: GF_AUTH_GITHUB_CLIENT_ID + _CLIENT_SECRET
  # - grafana-neon-rookia : NEON_ROOKIA_PASSWORD (referenced by the
  #   datasource entry below as $NEON_ROOKIA_PASSWORD)
  envFromSecret: grafana-github-oauth
  envFromSecrets:
    - name: grafana-neon-rookia
  service:
    type: ClusterIP
  # Recreate (not RollingUpdate) — local-path-provisioner is RWO, so a
  # rolling update would deadlock on the PVC AND double the memory budget
  # while old + new pods coexist. Recreate accepts ~30s of Grafana downtime
  # in exchange for a clean, predictable rollout.
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    size: 1Gi
  # Grafana baseline is ~150–250Mi; plugin install at boot (the VL datasource
  # below) briefly spikes higher, so the limit is set at 512Mi. OOMs at 256Mi.
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 250m
      memory: 512Mi
  # Disabled — modern k8s sets volume ownership via the pod's fsGroup (472,
  # the Grafana chart's default). The init-chown-data container is redundant
  # and was failing with chown exit code 1 on the local-path PVC. With
  # fsGroup, the kubelet handles ownership at mount time.
  initChownData:
    enabled: false
  sidecar:
    dashboards:
      enabled: true
    # Datasources sidecar disabled. We've burned six commits on it without
    # success: race conditions vs. Grafana's startup provisioning, the
    # chart's auto-VM datasource ConfigMap shadowing additionalDataSources,
    # initDatasources mode being flaky, and the reload API returning 401
    # because of our earlier admin-password reset. Going fully static via
    # `grafana.datasources` below — Secret mounted via subPath, guaranteed
    # to be on disk before Grafana starts.
    datasources:
      enabled: false
    resources:
      requests:
        cpu: 25m
        memory: 48Mi
      limits:
        cpu: 100m
        memory: 128Mi
  # VictoriaLogs Grafana plugin (slug confirmed against grafana.com plugin API).
  plugins:
    - victoriametrics-logs-datasource
  # Static datasource provisioning. The chart writes this map's keys as
  # files into a Secret, then subPath-mounts each into
  # /etc/grafana/provisioning/datasources/<filename> on the main container.
  # Subpath bind mounts happen at pod start, before Grafana boots — no race.
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: VictoriaMetrics
          type: prometheus
          access: proxy
          url: http://vmsingle-observability-victoria-metrics-k8s-stack.observability.svc.cluster.local:8428
          isDefault: true
          editable: true
          jsonData:
            timeInterval: 30s
        - name: VictoriaLogs
          type: victoriametrics-logs-datasource
          access: proxy
          url: http://observability-victoria-logs-single-server.observability.svc.cluster.local:9428
          isDefault: false
          editable: true
          jsonData:
            maxLines: 1000
        # ─── Rookia production Postgres (Neon) ─────────────────────────
        # Read-only role recommended (grafana_ro) — Grafana datasources
        # support arbitrary SQL, so anyone with dashboard access can run
        # DELETE if you give it owner credentials. Password is injected
        # from the sealed secret `grafana-neon-rookia` as the env var
        # NEON_ROOKIA_PASSWORD; Grafana substitutes $VAR_NAME at runtime.
        # FILL IN host/database/user before pushing — placeholders below.
        - name: Rookia (Neon prod)
          type: postgres
          url: ep-falling-breeze-agyt76z7-pooler.c-2.eu-central-1.aws.neon.tech:5432
          user: grafana_ro
          database: neondb
          isDefault: false
          editable: false
          secureJsonData:
            password: $NEON_ROOKIA_PASSWORD
          jsonData:
            sslmode: require
            postgresVersion: 1500 # Neon currently runs PG 15.x; bump to 1600 if upgraded
            timescaledb: false
            maxOpenConns: 5
            maxIdleConns: 2
            connMaxLifetime: 14400
