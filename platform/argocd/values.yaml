global:
  domain: argo.spaderlabs.com   # used in Phase 7 when Cloudflare Tunnel exposes this

configs:
  params:
    server.insecure: "true"     # Cloudflare terminates TLS; ArgoCD speaks plain HTTP internally
  cm:
    url: https://argo.spaderlabs.com
    timeout.reconciliation: 180s
    application.instanceLabelKey: argocd.argoproj.io/instance

    # GitHub OAuth via Dex. Client ID/Secret are read from argocd-secret
    # (sealed in platform/argocd/manifests/admin-password.sealedsecret.yaml).
    # The $key syntax tells Dex to substitute from argocd-secret at runtime.
    dex.config: |
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: $dex.github.clientID
            clientSecret: $dex.github.clientSecret

  secret:
    createSecret: false         # we manage argocd-secret ourselves via SealedSecret

  # RBAC — default-deny. Only users named below get any permissions.
  # Format reference: https://argo-cd.readthedocs.io/en/stable/operator-manual/rbac/
  rbac:
    policy.default: ''
    policy.csv: |
      g, everspader, role:admin

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  service:
    type: ClusterIP             # exposed via Cloudflare Tunnel, not LoadBalancer

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

applicationSet:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

notifications:
  enabled: false

dex:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
