apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/everspader/homelab.git
    targetRevision: HEAD
    path: platform/namespaces/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd        # placeholder; the Namespace/ResourceQuota manifests carry their own namespace
  syncPolicy:
    automated:
      selfHeal: true
      prune: true            # if a tenant's <name>.yaml is removed, drop the namespace
    syncOptions:
      - ServerSideApply=true
