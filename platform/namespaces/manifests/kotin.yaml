apiVersion: v1
kind: Namespace
metadata:
  name: kotin
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: kotin-quota
  namespace: kotin
# Production api (RollingUpdate surge, 1 extra pod) plus headroom for the Sync-hook
# migrate Job.
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 1Gi
