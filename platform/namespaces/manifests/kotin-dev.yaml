apiVersion: v1
kind: Namespace
metadata:
  name: kotin-dev
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: kotin-dev-quota
  namespace: kotin-dev
# Dev api (RollingUpdate surge, 1 extra pod) plus headroom for the Sync-hook
# migrate Job. Revisit when a prod api is added.
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 1Gi
