# Homelab Postgres overrides — drop-in under /etc/postgresql/17/main/conf.d/.
# Ubuntu's main postgresql.conf already includes_dir 'conf.d'.

# --- Networking ---
# Bind to all interfaces; ufw + pg_hba.conf gate who can actually connect.
listen_addresses = '*'

# Force modern auth for password connections.
password_encryption = scram-sha-256

# --- Memory (16GB host, shared with k3s + tenants) ---
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 16MB
maintenance_work_mem = 128MB

# --- Logging ---
log_min_duration_statement = 250ms     # log queries slower than 250ms
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
log_connections = on
log_disconnections = on

# --- WAL / archiving (pgBackRest) ---
# wal_level=replica is the default in PG17, set explicit for clarity.
wal_level = replica
max_wal_senders = 3
archive_mode = on
archive_command = 'pgbackrest --stanza=main archive-push %p'
archive_timeout = 600                   # force WAL switch every 10 min on writes — no point being more granular for a weekly-write DB
