# Homelab pg_hba.conf — replaces /etc/postgresql/17/main/pg_hba.conf via symlink.
#
# Ordering matters: first matching rule wins. Order is:
#   1. Local Unix socket peer auth (admin from the postgres OS user)
#   2. Loopback TCP (backup tools, local clients on the host)
#   3. Tailscale tailnet (remote access from Mac/phone over Tailscale)
#   4. LAN (Deco mesh)
#   5. k3s pod CIDR (in-cluster tenants like Rookia connecting to host Postgres)
#
# Everything else is rejected by default.

# TYPE   DATABASE  USER  ADDRESS         METHOD

# 1. Local Unix socket — peer auth maps OS user → Postgres role of same name.
local    all       all                   peer

# 2. Loopback TCP for tools on the host itself (pgBackRest, psql -h localhost).
host     all       all   127.0.0.1/32    scram-sha-256
host     all       all   ::1/128         scram-sha-256

# 3. Tailscale tailnet (CGNAT range used by Tailscale).
host     all       all   100.64.0.0/10   scram-sha-256

# 4. LAN — Deco assigns 192.168.68.0/24 today; broader covers any VLAN expansion.
host     all       all   192.168.0.0/16  scram-sha-256

# 5. k3s pod CIDR — default 10.42.0.0/16. Tenant pods can connect directly.
host     all       all   10.42.0.0/16    scram-sha-256

# Replication — local for pgBackRest.
local    replication  all                peer
host     replication  all   127.0.0.1/32 scram-sha-256
