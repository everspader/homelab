apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: rookia
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: worker
    spec:
      # CLAUDE.md trap: pg-boss workers need 60s grace so in-flight jobs
      # can finish before the pod is killed during a rollout.
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: worker
          image: ghcr.io/everspader/rookia-api:0.10.1
          imagePullPolicy: IfNotPresent
          # Same image as the API; worker entrypoint overrides the default CMD.
          command: ["bun", "run", "src/worker.ts"]
          envFrom:
            - secretRef:
                name: rookia-env
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # No HTTP probes — pg-boss workers don't expose HTTP. K8s restarts
          # on container exit; if we ever want active liveness, add a sidecar
          # health endpoint or use exec probes against the pg-boss state table.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
