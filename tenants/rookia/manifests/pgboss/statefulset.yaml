apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pgboss-pg
  namespace: rookia
  labels:
    app: pgboss-pg
spec:
  serviceName: pgboss-pg
  replicas: 1
  selector:
    matchLabels:
      app: pgboss-pg
  template:
    metadata:
      labels:
        app: pgboss-pg
    spec:
      # Allow postgres a clean fast-shutdown on rollouts.
      terminationGracePeriodSeconds: 60
      securityContext:
        # postgres image's "postgres" user.
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: pg
              containerPort: 5432
              protocol: TCP
          env:
            # PGDATA must be a subdirectory of the mount, otherwise the postgres
            # init refuses to write into a non-empty volume root (lost+found etc.)
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: pgboss-pg-creds
          # Sized to leave headroom in the rookia-quota (limits.cpu hard=2):
          # api=750m + worker=500m + pgboss=200m = 1450m, leaving 550m for the
          # migrate Job's 500m hook pod. Actual idle usage is ~7m / 24Mi —
          # this limit only caps bursts during heavy enqueue periods.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # k8s admission injects volumeMode=Filesystem if omitted, which then
        # shows as drift against this manifest. Set it explicitly to match.
        volumeMode: Filesystem
        # k3s default: local-path-provisioner. Pin'd to a single node — fine
        # for this single-node cluster; revisit before scaling out.
        resources:
          requests:
            storage: 1Gi
