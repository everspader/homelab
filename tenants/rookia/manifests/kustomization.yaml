apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Kustomize source for the rookia ArgoCD Application. Replaces the previous
# `directory.recurse: true` discovery so we get a single, declarative `images:`
# block — both as a sanity check (api / migrate-job can no longer
# drift to different tags) and as the write-back target for argocd-image-updater.
namespace: rookia
resources:
  # Shared SealedSecrets (sync wave 0)
  - sealed-env.yaml
  - sealed-ghcr-pull.yaml
  # API service (deployment + service + sync-wave-5 migrate Job)
  - api/deployment.yaml
  - api/service.yaml
  - api/migrate-job.yaml
# Single source of truth for the rookia-api image tag. Every container that
# references `ghcr.io/everspader/rookia-api` (api Deployment,
# migrate Job) gets rewritten to `newTag` at build time.
#
# argocd-image-updater is annotated to write back into THIS block — see
# `tenants/rookia/app.yaml` for the update strategy + auth wiring.
images:
  - name: ghcr.io/everspader/rookia-api
    newTag: 0.10.17
