# Drizzle migrations for the Rookia API.
# Sync hook (NOT PreSync) at wave 5. Reasoning:
#   - PreSync runs before the Sync phase even applies our SealedSecrets,
#     so the migrate Job would have no rookia-env / ghcr-pull to consume.
#   - Sync wave 0 (default): SealedSecrets land, controller decrypts them.
#   - Sync wave 5: this Job runs against the now-existing secrets.
#   - Sync wave 10: Deployments roll out (api/worker), only after migration.
# Failure here still aborts the sync — old pods keep serving the old schema.
apiVersion: batch/v1
kind: Job
metadata:
  # Fixed name (not generateName) so this resource is valid Kustomize input.
  # `hook-delete-policy: BeforeHookCreation` already deletes the previous Job
  # before each Sync, so we don't need a unique-per-run name.
  name: rookia-api-migrate
  namespace: rookia
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "5"
spec:
  backoffLimit: 0 # fail loud
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: migrate
          image: ghcr.io/everspader/rookia-api:0.10.2 # tag overridden by ../kustomization.yaml `images:` (kept in lockstep with api/worker)
          imagePullPolicy: IfNotPresent
          # Image's WORKDIR is /app/apps/api; the api package.json's "db:migrate"
          # script runs packages/core/src/db/migrate.ts against the bundled
          # packages/core/drizzle/ migrations directory.
          command: ["bun", "run", "db:migrate"]
          envFrom:
            - secretRef:
                name: rookia-env
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
