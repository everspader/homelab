apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rookia-worker
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/everspader/homelab.git
    targetRevision: HEAD
    path: tenants/rookia/worker/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: rookia
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
