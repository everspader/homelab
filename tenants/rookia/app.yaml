apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rookia
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  # argocd-image-updater config. The updater watches GHCR for new tags
  # matching the regex below, then commits the bumped tag into
  # tenants/rookia/manifests/kustomization.yaml's `images:` block. ArgoCD
  # then syncs the new tag into all three references (api, worker, migrate).
  #
  #   image-list                : alias=image — `rookia` is the alias used in
  #                               every other annotation key below.
  #   update-strategy: semver   : pick highest semver tag matching allow-tags.
  #   allow-tags                : strict X.Y.Z (no -rc / -beta / -dev).
  #   pull-secret               : cross-namespace read of rookia/ghcr-pull,
  #                               granted by platform/argocd-image-updater RBAC.
  #   write-back-method: git    : commit to git (not just patch in-cluster).
  #   git:secret:argocd/...     : GitHub App creds reused from ArgoCD's repo
  #                               creds; the App needs `Contents: write`.
  #   write-back-target:        : kustomization → modify `images:` newTag in
  #                               tenants/rookia/manifests/kustomization.yaml.
  annotations:
    argocd-image-updater.argoproj.io/image-list: rookia=ghcr.io/everspader/rookia-api
    argocd-image-updater.argoproj.io/rookia.update-strategy: semver
    argocd-image-updater.argoproj.io/rookia.allow-tags: 'regexp:^\d+\.\d+\.\d+$'
    argocd-image-updater.argoproj.io/rookia.pull-secret: pullsecret:rookia/ghcr-pull
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/github-app-homelab
    argocd-image-updater.argoproj.io/git-branch: main
    argocd-image-updater.argoproj.io/write-back-target: kustomization
spec:
  project: default
  source:
    repoURL: https://github.com/everspader/homelab.git
    targetRevision: HEAD
    # Kustomize-mode source. The kustomization.yaml at this path enumerates
    # every resource explicitly and centralizes the rookia-api image tag in
    # one `images:` block — that block is also what argocd-image-updater
    # rewrites on each new GHCR tag.
    #
    # Add a new service (e.g. admin UI) by dropping its manifests under
    # manifests/<name>/ AND listing them in kustomization.yaml's resources.
    path: tenants/rookia/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: rookia
  syncPolicy:
    automated:
      selfHeal: true
      # prune=false because the SealedSecrets are owned here too — we don't
      # want a renamed file to silently delete the underlying Secret out from
      # under running pods. Manual prune via `argocd app sync rookia --prune`
      # when intentional.
      prune: false
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
