apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Kustomize source for the tally-dev ArgoCD Application. The `images:` block
# below is the single source of truth for image tags and is what
# argocd-image-updater rewrites on a matching GHCR tag (see ../app.yaml).
namespace: tally-dev
resources:
  - sealed-env.yaml
  - sealed-ghcr-pull.yaml
  - api/deployment.yaml
  - api/service.yaml
  - api/job.yaml
  - worker/deployment.yaml
images:
  - name: ghcr.io/everspader/tally-api
    newTag: 1.13.0
  - name: ghcr.io/everspader/tally-worker
    newTag: 0.4.0
