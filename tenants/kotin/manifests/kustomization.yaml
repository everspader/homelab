apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Kustomize source for the kotin ArgoCD Application. The `images:` block is
# the single source of truth for the image tag. It is pinned: only a commit
# changes it, made by `bun run promote` / `promote:api` in the kotin repo
# (see ../app.yaml).
namespace: kotin
resources:
  - sealed-env.yaml
  - sealed-ghcr-pull.yaml
  - api/deployment.yaml
  - api/service.yaml
  - api/job.yaml
images:
  - name: ghcr.io/everspader/kotin-api
    newTag: 0.22.1
