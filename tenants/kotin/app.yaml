apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kotin
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  # No ImageUpdater: production runs only promoted versions. The image tag in
  # manifests/kustomization.yaml changes only by a commit, made by
  # `bun run promote` / `bun run promote:api` in the kotin repo
  # (docs/releasing.md, "Production release cycle"). kotin-dev follows every tag.
spec:
  project: default
  source:
    repoURL: https://github.com/everspader/homelab.git
    targetRevision: HEAD
    path: tenants/kotin/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: kotin
  syncPolicy:
    automated:
      selfHeal: true
      # prune disabled: this tenant carries SealedSecrets; a renamed sealed
      # file with prune on could delete the live Secret. Same caution as rookia.
      prune: false
    syncOptions:
      - ServerSideApply=true
