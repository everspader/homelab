apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nestapp-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  # argocd-image-updater: same setup as tenants/tally-dev/app.yaml (semver
  # strategy, strict X.Y.Z allow-tags, cross-namespace pull secret, GitHub App
  # write-back into this tenant's kustomization.yaml). The image is built by the
  # nestapp repo's CI on `api@X.Y.Z` release tags and pushed as nest-api:X.Y.Z.
  annotations:
    argocd-image-updater.argoproj.io/image-list: nest=ghcr.io/everspader/nest-api
    argocd-image-updater.argoproj.io/nest.update-strategy: semver
    argocd-image-updater.argoproj.io/nest.allow-tags: 'regexp:^\d+\.\d+\.\d+$'
    argocd-image-updater.argoproj.io/nest.pull-secret: pullsecret:nestapp-dev/ghcr-pull
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/github-app-homelab
    argocd-image-updater.argoproj.io/git-branch: main
    argocd-image-updater.argoproj.io/write-back-target: kustomization
spec:
  project: default
  source:
    repoURL: https://github.com/everspader/homelab.git
    targetRevision: HEAD
    path: tenants/nestapp-dev/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: nestapp-dev
  syncPolicy:
    automated:
      selfHeal: true
      # prune disabled: this tenant carries SealedSecrets; a renamed sealed
      # file with prune on could delete the live Secret. Same caution as rookia.
      prune: false
    syncOptions:
      - ServerSideApply=true
