# Drizzle migrations for the nestapp-dev API.
# ArgoCD PreSync hook: runs BEFORE the Deployment is touched on every sync.
# If the migration fails, the rest of the sync aborts and the old pods keep running.
# The image's CMD is the server; migrations are the second entrypoint
# (`node dist/migrate.js`, MIGRATIONS_DIR=/app/drizzle set in the image).
apiVersion: batch/v1
kind: Job
metadata:
  name: nest-api-migrate
  namespace: nestapp-dev
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0 # don't retry — fail loud
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: migrate
          image: ghcr.io/everspader/nest-api:0.1.0 # tag overridden by ../kustomization.yaml `images:` (kept in lockstep with Deployment)
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/migrate.js"]
          envFrom:
            - secretRef:
                name: nestapp-env
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
