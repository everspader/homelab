apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Kustomize source for the nestapp-dev ArgoCD Application. The `images:` block is
# the single source of truth for the image tag and is what
# argocd-image-updater rewrites on a matching GHCR tag (see ../app.yaml).
namespace: nestapp-dev
resources:
  - sealed-env.yaml
  - sealed-ghcr-pull.yaml
  - api/deployment.yaml
  - api/service.yaml
  - api/job.yaml
images:
  - name: ghcr.io/everspader/nest-api
    newTag: 0.1.0
