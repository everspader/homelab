apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kotin-dev
  labels:
    app: api
  annotations:
    argocd.argoproj.io/sync-wave: "10" # after the migrate Job (wave 5)
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # new pod ready before old goes away
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: ghcr-pull # SealedSecret in the same namespace
      containers:
        - name: api
          image: ghcr.io/everspader/kotin-api:0.5.0 # tag overridden by ../kustomization.yaml `images:` (managed by argocd-image-updater)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: kotin-env # SealedSecret unsealed into this Secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000 # node image's "node" user; numeric UID so kubelet can enforce runAsNonRoot
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
