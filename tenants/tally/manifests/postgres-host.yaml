# Headless Service + manual Endpoints pointing at the host Postgres
# (systemd postgresql@17-main on the node). Keeps pod->DB traffic on the
# LAN/pod-network path instead of hairpinning through tailscale0 — so an
# expired/flapping tailscale key can't take the app down.
#
# NOTE: We use the legacy `v1 Endpoints` resource (not the newer
# `discovery.k8s.io/v1 EndpointSlice`) because ArgoCD's default
# resource.exclusions list suppresses EndpointSlice. Endpoints is
# deprecated in k8s v1.33+ but still functional and is the pragmatic
# choice for GitOps-managed static host targets. kube-proxy mirrors
# Endpoints into an auto-generated EndpointSlice internally.
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-host
  namespace: tally
spec:
  type: ClusterIP
  clusterIP: None   # headless — DNS returns the endpoint IP directly
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: postgres-host   # MUST match the Service name
  namespace: tally
subsets:
  - addresses:
      - ip: 192.168.68.106   # node InternalIP (eno1)
    ports:
      - name: postgres
        port: 5432
        protocol: TCP
