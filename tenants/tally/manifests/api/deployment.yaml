apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tally
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0      # zero-downtime even at replicas=1 (new pod ready before old goes away)
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: ghcr-pull   # SealedSecret in the same namespace
      containers:
        - name: api
          image: ghcr.io/everspader/tally-api:0.1.0   # bump on each release
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          envFrom:
            - secretRef:
                name: tally-env       # SealedSecret unsealed into this Secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000           # bun image's "bun" user; kubelet needs a numeric UID to enforce runAsNonRoot
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # /tmp is needed because readOnlyRootFilesystem=true blocks writes
        # everywhere else; Bun may write transient files there.
        - name: tmp
          emptyDir: {}
