apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Kustomize source for the tally ArgoCD Application. Replaces the previous
# `directory.recurse: true` so the tally-api image tag is centralised in the
# `images:` block below — that block is what argocd-image-updater rewrites
# whenever a new GHCR tag matches the rookia-style semver allow-tags regex.
namespace: tally
resources:
  - sealed-env.yaml
  - sealed-ghcr-pull.yaml
  - api/deployment.yaml
  - api/service.yaml
  - api/job.yaml
# Single source of truth for the tally-api image tag. Both the api Deployment
# and the PreSync migrate Job pick up this tag, so they can never drift.
images:
  - name: ghcr.io/everspader/tally-api
    newTag: 1.1.0
