apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tally
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  # Image tag bumps come from the ImageUpdater CR in
  # platform/argocd-image-updater/manifests/tally.yaml (semver X.Y.Z,
  # git write-back into manifests/kustomization.yaml's `images:` block).
spec:
  project: default
  source:
    repoURL: https://github.com/everspader/homelab.git
    targetRevision: HEAD
    path: tenants/tally/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: tally
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
