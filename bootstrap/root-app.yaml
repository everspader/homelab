apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/everspader/homelab.git
    targetRevision: HEAD
    path: .
    directory:
      recurse: true
      # Picks up:
      #   - flat tenants:  tenants/<tenant>/app.yaml          (e.g. tally)
      #   - split tenants: tenants/<tenant>/<service>/app.yaml (e.g. rookia/api, rookia/worker)
      # Same for platform components.
      include: "{platform/*/app.yaml,tenants/*/app.yaml,tenants/*/*/app.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
